<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektromia - Elektronik Devreler ve Notlar</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00ff66;
            --border-color: #333;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px dashed var(--accent-color);
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 2px;
        }
        header p {
            color: #888;
            margin-top: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
        }
        .card-img-container {
            width: 100%;
            height: 160px;
            background-color: #111;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }
        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
            transition: transform 0.3s;
        }
        .card:hover .card-img-container img {
            transform: scale(1.05);
        }
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .card p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ccc;
            flex-grow: 1;
        }
        .tag {
            display: inline-block;
            background-color: #2a2a2a;
            color: var(--accent-color);
            padding: 3px 8px;
            font-size: 0.8rem;
            border-radius: 3px;
            margin-top: 10px;
            align-self: flex-start;
            border: 1px solid #444;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Elektromia</h1>
        <p>// Analog Devreler, Şemalar ve Donanım Notları</p>
    </header>

    <div class="container">
        <!-- Kart 1 -->
        <div class="card">
            <div class="card-img-container">
                <img src="img/astable.png" alt="Astable Multivibrator">
            </div>
            <div class="card-content">
                <h3>Astable Multivibrator</h3>
                <p>BJT transistörler kullanılarak tasarlanmış kare dalga üreteci devresi. Osiloskop testleri ve saat sinyali üretimi için temel yapı taşı.</p>
                <span class="tag">Transistör / Osilatör</span>
            </div>
        </div>

    <footer>
        <p>Elektromia © 2026 | GitHub Pages Üzerinden Yayında</p>
    </footer>

</body>
</html>
